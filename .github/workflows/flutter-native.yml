name: TalkOS Native Flutter CI

on:
  push:
    branches: [main, "feat/flutter-native-foundation"]
    paths:
      - "apps/talkos_flutter/**"
      - ".github/workflows/flutter-native.yml"
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - "apps/talkos_flutter/**"
      - ".github/workflows/flutter-native.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub Prerelease with all native platform binaries"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/talkos_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,ios,windows,macos,linux --project-name talkos --org com.talkofthetown .
      - name: Remove Flutter's generated starter test
        run: rm -f test/widget_test.dart
      - run: dart format .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/talkos_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --project-name talkos --org com.talkofthetown .
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: talkos-android-release
          path: |
            apps/talkos_flutter/build/app/outputs/flutter-apk/app-release.apk
            apps/talkos_flutter/build/app/outputs/bundle/release/app-release.aab

  windows:
    needs: analyze-and-test
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/talkos_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=windows --project-name talkos --org com.talkofthetown .
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows release zip
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath talkos-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: talkos-windows-release
          path: |
            apps/talkos_flutter/talkos-windows-x64.zip
            apps/talkos_flutter/build/windows/x64/runner/Release/

  linux:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/talkos_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter create --platforms=linux --project-name talkos --org com.talkofthetown .
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package Linux release bundle
        run: |
          tar -czvf talkos-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: talkos-linux-release
          path: |
            apps/talkos_flutter/talkos-linux-x64.tar.gz
            apps/talkos_flutter/build/linux/x64/release/bundle/

  apple:
    needs: analyze-and-test
    runs-on: macos-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/talkos_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=ios,macos --project-name talkos --org com.talkofthetown .
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: flutter build macos --release
      - name: Package Apple release zips
        run: |
          ditto -c -k --sequesterRsrc build/macos/Build/Products/Release/Runner.app talkos-macos.zip
          ditto -c -k --sequesterRsrc build/ios/iphoneos/Runner.app talkos-ios.zip
      - uses: actions/upload-artifact@v4
        with:
          name: talkos-apple-builds
          path: |
            apps/talkos_flutter/talkos-macos.zip
            apps/talkos_flutter/talkos-ios.zip
            apps/talkos_flutter/build/ios/iphoneos/Runner.app
            apps/talkos_flutter/build/macos/Build/Products/Release/Runner.app

  publish-release:
    needs: [android, windows, linux, apple]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/talkos-android-release/app-release.apk
            release-artifacts/talkos-android-release/app-release.aab
            release-artifacts/talkos-windows-release/talkos-windows-x64.zip
            release-artifacts/talkos-linux-release/talkos-linux-x64.tar.gz
            release-artifacts/talkos-apple-builds/talkos-macos.zip
            release-artifacts/talkos-apple-builds/talkos-ios.zip
          draft: false
          prerelease: true
          generate_release_notes: true
