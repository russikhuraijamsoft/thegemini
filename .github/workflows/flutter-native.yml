name: TalkOS Native Flutter CI

on:
  push:
    branches: [main, "feat/flutter-native-foundation"]
    paths:
      - "apps/talkos_flutter/**"
      - ".github/workflows/flutter-native.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/talkos_flutter/**"
      - ".github/workflows/flutter-native.yml"

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/talkos_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,ios,windows,macos --project-name talkos --org com.talkofthetown .
      - run: dart format .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/talkos_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --project-name talkos --org com.talkofthetown .
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: talkos-android-release
          path: |
            apps/talkos_flutter/build/app/outputs/flutter-apk/app-release.apk
            apps/talkos_flutter/build/app/outputs/bundle/release/app-release.aab

  windows:
    needs: analyze-and-test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/talkos_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=windows --project-name talkos --org com.talkofthetown .
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: talkos-windows-release
          path: apps/talkos_flutter/build/windows/x64/runner/Release/

  apple:
    needs: analyze-and-test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/talkos_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=ios,macos --project-name talkos --org com.talkofthetown .
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: flutter build macos --release
      - uses: actions/upload-artifact@v4
        with:
          name: talkos-apple-builds
          path: |
            apps/talkos_flutter/build/ios/iphoneos/Runner.app
            apps/talkos_flutter/build/macos/Build/Products/Release/Runner.app
