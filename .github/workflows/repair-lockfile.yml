name: Repair TalkOS lockfile (temporary)
on:
  push:
    branches:
      - fix/talkos-ci-dependencies
    paths:
      - .github/workflows/repair-lockfile.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/talkos-ci-dependencies
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate consistent dependency lockfile
        run: |
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit repaired lockfile to repair branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: regenerate npm lockfile" || exit 0
          git push origin HEAD:fix/talkos-ci-dependencies
