
name: TalkOS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: talkos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run typecheck --if-present

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Run Unit Tests
        run: npm run test

      - name: Build Application
        run: npm run build
        env:
          NODE_ENV: production
          
