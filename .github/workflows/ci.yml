name: TalkOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-build:
    name: Lint, Test & Build (Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Type Check & Lint (TypeScript)
        run: npm run lint

      - name: Run Unit Tests (Vitest)
        run: npm run test

      - name: Build Web & Server Bundle
        run: npm run build
        env:
          NODE_ENV: production
